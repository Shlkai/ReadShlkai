name: Capas dos mangás
on:
  push:
    branches: [main]
    paths: ['covers/series.json', 'tools/capas.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 tools/capas.py
      - run: |
          git config user.name "shikai-capas"
          git config user.email "actions@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || git commit -m "Capas dos mangás atualizadas"
          git push
